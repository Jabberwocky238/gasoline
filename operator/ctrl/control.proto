syntax = "proto3";
package ctrl;
option go_package = "github.com/jabberwocky238/gasoline/operator/ctrl";

// --------------- Service ---------------

service OperatorService {
  rpc Register(RegisterReq) returns (RegisterResp);
  rpc Ping(PingReq) returns (PingResp);
  rpc Discover(DiscoverReq) returns (DiscoverResp);
  rpc NotifySession(SessionEvent) returns (Ack);
}

message Ack {}

// --------------- Register ---------------

message RegisterReq {
  bytes  uuid          = 1; // 16 bytes, caller's operator UUID
  string external_addr = 2; // address others should use to reach us
}

message RegisterResp {
  bytes  uuid          = 1; // 16 bytes, responder's operator UUID
  string external_addr = 2;
}

// --------------- Ping ---------------

message PingReq {
  int64 unix_nano = 1;
}

message PingResp {
  int64 unix_nano = 1; // echo back
}

// --------------- Discover ---------------

message DiscoverReq {}

message DiscoverResp {
  repeated OperatorEntry operators = 1;
}

message OperatorEntry {
  bytes  uuid = 1; // 16 bytes
  string addr = 2; // external address
}

// --------------- Session ---------------

message SessionEvent {
  oneof event {
    SessionSync   sync   = 1;
    SessionRevoke revoke = 2;
  }
}

message SessionSync {
  bytes  session_id    = 1; // 16 bytes
  bytes  vni       = 2; // 4 bytes big-endian VNI
  bytes  operator_uuid = 3; // 16 bytes
  bytes  ip_addr       = 4; // 4 bytes (IPv4) or 16 bytes (IPv6)
  uint32 prefix_bits   = 5;
  bytes  cid     = 6; // 6 bytes, MAC-sized forwarding identity
}

message SessionRevoke {
  bytes  session_id = 1; // 16 bytes
  bytes  vni    = 2; // 4 bytes big-endian VNI
}
