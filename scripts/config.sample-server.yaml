# Gasoline Operator Configuration
# Usage: gasoline operator -c config.sample-server.yaml

listen: "0.0.0.0:8443"
op-listen: "0.0.0.0:6677"
transport: "quic"

# Global default auth (used when a VNet has no per-VNet auth)
auth: "noauth"

# Each network can override auth independently
network:
  - vnet: 200
    cidr: "10.0.0.0/24"
    # auth: "noauth"  # inherits global default
  - vnet: 1000
    cidr: "192.168.200.0/24"
    auth: "hmac:client1:mysecret;client2:othersecret"
